name: Build CrystalEngine

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows build
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $artifactDir = Join-Path $PWD "windows-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $exeFiles = Get-ChildItem -Path build -Recurse -Filter "*.exe" -File |
            Where-Object { $_.FullName -notmatch "\\CMakeFiles\\" }

          if ($exeFiles.Count -eq 0) {
            throw "No executable found under build/"
          }

          foreach ($exe in $exeFiles) {
            $targetPath = Join-Path $artifactDir $exe.Name
            Copy-Item $exe.FullName -Destination $targetPath -Force

            if ($env:WINDOWS_PFX_BASE64 -and $env:WINDOWS_PFX_PASSWORD) {
              $certPath = Join-Path $PWD "certificate.pfx"
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))

              $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
              if ($signtool) {
                & $signtool.Source sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_PFX_PASSWORD $targetPath
                if ($LASTEXITCODE -ne 0) {
                  throw "Code signing failed for $targetPath"
                }
              } else {
                Write-Warning "signtool.exe was not found; the artifact will remain unsigned."
              }
            } else {
              Write-Warning "Signing certificate secrets are not configured; the artifact will remain unsigned."
            }
          }

          $notePath = Join-Path $artifactDir "README.txt"
          @"
          CrystalEngine Windows build
          ---------------------------
          This artifact is built by GitHub Actions.
          If a code signing certificate is configured via repository secrets,
          the executable will be signed automatically.
          Without signing, Windows Defender may still show a warning.
          "@ | Set-Content -Path $notePath -Encoding UTF8

          $zipPath = Join-Path $PWD "CrystalEngine-Windows.zip"
          Compress-Archive -Path "$artifactDir/*" -DestinationPath $zipPath -Force

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: CrystalEngine-Windows
          path: CrystalEngine-Windows.zip