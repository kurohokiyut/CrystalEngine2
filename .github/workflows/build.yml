name: Build CrystalEngine

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build-windows:

    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Configure CMake
      run: cmake -S . -B build


    - name: Build
      run: cmake --build build --config Release


    - name: Upload Build
      uses: actions/upload-artifact@v4
      with:
        name: CrystalEngine-Windows
        path: |
          build/Release/*.exe
          build/*.exe