name: Build CrystalEngine

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows build
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $artifactDir = Join-Path $PWD "windows-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $exeFiles = Get-ChildItem -Path build -Recurse -Filter "*.exe" -File |
            Where-Object { $_.FullName -notmatch "\\CMakeFiles\\" }

          if ($exeFiles.Count -eq 0) {
            throw "No executable found under build/"
          }

          foreach ($exe in $exeFiles) {
            $targetPath = Join-Path $artifactDir $exe.Name
            Copy-Item $exe.FullName -Destination $targetPath -Force

            $certPath = $null
            $certPassword = $null

            if ($env:WINDOWS_PFX_BASE64 -and $env:WINDOWS_PFX_PASSWORD) {
              $certPath = Join-Path $PWD "certificate.pfx"
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
              $certPassword = $env:WINDOWS_PFX_PASSWORD
            } else {
              Write-Warning "Signing certificate secrets are not configured; generating a temporary self-signed certificate for this workflow run."

              $tempCertPath = Join-Path $PWD "temporary-sign.pfx"
              $tempPassword = [System.Guid]::NewGuid().ToString()

              $cert = New-SelfSignedCertificate `
                -Type CodeSigningCert `
                -Subject "CN=Crystal Developer Temporary" `
                -CertStoreLocation "Cert:\CurrentUser\My" `
                -KeyExportPolicy Exportable `
                -KeySpec Signature `
                -KeyLength 2048 `
                -NotAfter (Get-Date).AddYears(1)

              Export-PfxCertificate `
                -Cert $cert `
                -FilePath $tempCertPath `
                -Password (ConvertTo-SecureString -String $tempPassword -Force -AsPlainText) | Out-Null

              $certPath = $tempCertPath
              $certPassword = $tempPassword
            }

            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtool) {
              & $signtool.Source sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $certPassword $targetPath
              if ($LASTEXITCODE -ne 0) {
                throw "Code signing failed for $targetPath"
              }
            } else {
              Write-Warning "signtool.exe was not found; the artifact will remain unsigned."
            }
          }

          $notePath = Join-Path $artifactDir "README.txt"
          @"
          CrystalEngine Windows build
          ---------------------------
          Publisher: Crystal Developer

          This artifact is built by GitHub Actions.
          If a code signing certificate is configured via repository secrets,
          the executable will be signed automatically.
          Without signing, Windows Defender may still show a warning.

          To avoid false positives, use the ZIP package and run the executable only
          if you trust this build source. Code signing is the reliable way to
          reduce Windows Defender warnings.
          "@ | Set-Content -Path $notePath -Encoding UTF8

          $zipPath = Join-Path $PWD "CrystalEngine-Windows.zip"
          Compress-Archive -Path "$artifactDir/*" -DestinationPath $zipPath -Force

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: CrystalEngine-Windows
          path: CrystalEngine-Windows.zip