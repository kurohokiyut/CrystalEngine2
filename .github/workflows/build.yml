name: CrystalEngine Build

on:
  push:
  pull_request:

jobs:

  build:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - name: Configure

      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build

      run: |
        cd build
        cmake --build . --config Release